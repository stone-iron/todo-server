spring.application.name=todo
server.port=8080

# 데이터 소스 - MySQL (본인 환경에 맞게 수정)
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.datasource.url=jdbc:mysql://127.0.0.1:3306/aloha?serverTimezone=Asia/Seoul&allowPublicKeyRetrieval=true&useSSL=false
spring.datasource.username=aloha
spring.datasource.password=123456

# MyBatis 설정
# - created_at 컬럼을 createdAt 필드로 자동 매핑
mybatis.configuration.map-underscore-to-camel-case=true
mybatis.type-aliases-package=com.aloha.todo.domain
mybatis.mapper-locations=classpath:mybatis/mapper/**/*.xml

# PageHelper 설정
pagehelper.helper-dialect=mysql
pagehelper.reasonable=true
pagehelper.support-methods-arguments=true
pagehelper.params=count=countSql

# Swagger UI
springdoc.swagger-ui.path=/swagger-ui.html

# 로깅 레벨
logging.level.root=INFO
logging.level.com.aloha.todo=DEBUG
